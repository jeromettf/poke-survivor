<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d1424">
<title>관동 원정기</title>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="관동 원정기">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect x='4' y='1' width='8' height='14' fill='%23000'/%3E%3Crect x='1' y='4' width='14' height='8' fill='%23000'/%3E%3Crect x='2' y='2' width='12' height='12' fill='%23000'/%3E%3Crect x='3' y='3' width='10' height='4' fill='%23e84a3a'/%3E%3Crect x='3' y='9' width='10' height='4' fill='%23f4f4f4'/%3E%3Crect x='6' y='6' width='4' height='4' fill='%23f4f4f4'/%3E%3Crect x='7' y='7' width='2' height='2' fill='%23000'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri/dist/galmuri.css">
<style>
:root{--bg:#0d1424;--pn:#1b2740;--pn2:#26365a;--ln:#f4e8c8;--gold:#ffcc33;--red:#e84a3a;--blue:#4ab8ff;--grn:#5fd068;--txt:#f4ecd8;--dim:#8fa0c0;--sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;margin:0}
html,body{height:100%;background:var(--bg);overflow:hidden;font-family:'Galmuri11','Galmuri9',sans-serif;color:var(--txt);touch-action:none;font-size:13px}
button{font-family:inherit;color:inherit;cursor:pointer}
img.ico{image-rendering:pixelated;display:block}
#cv{position:fixed;inset:0;display:block}
/* 픽셀 패널 */
.px{background:var(--pn);border:3px solid var(--ln);box-shadow:-3px 0 0 #000,3px 0 0 #000,0 -3px 0 #000,0 3px 0 #000,6px 6px 0 rgba(0,0,0,.35)}
.px.dark{background:#111a2c;border-color:#5a6a8a}
.pb{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:var(--red);border:3px solid var(--ln);box-shadow:-3px 0 0 #000,3px 0 0 #000,0 -3px 0 #000,0 3px 0 #000,0 7px 0 #7a1a10;font-family:'Galmuri14',sans-serif;font-size:18px;padding:12px 10px;margin:6px 0 14px;color:#fff;text-shadow:2px 2px 0 rgba(0,0,0,.4)}
.pb:active{transform:translateY(4px);box-shadow:-3px 0 0 #000,3px 0 0 #000,0 -3px 0 #000,0 3px 0 #000,0 3px 0 #7a1a10}
.pb.blue{background:#2a6ab0;box-shadow:-3px 0 0 #000,3px 0 0 #000,0 -3px 0 #000,0 3px 0 #000,0 7px 0 #123a6a}
.pb.gray{background:#3a4660;box-shadow:-3px 0 0 #000,3px 0 0 #000,0 -3px 0 #000,0 3px 0 #000,0 7px 0 #1a2234}
.pb.sm{font-size:14px;padding:8px;margin:4px 0 10px}
.pb:disabled{filter:grayscale(1) brightness(.6)}
/* HUD */
.hud{position:fixed;pointer-events:none;z-index:2}
#top{left:0;right:0;top:0;padding:calc(var(--sat) + 4px) 8px 0}
#xpw{position:relative;height:16px;background:#0a0f1c;border:2px solid #000;outline:2px solid var(--ln)}
#xpw i{display:block;height:100%;width:0;background:linear-gradient(#7ae0ff 0 30%,#3aa8e8 30%)}
#xpw b{position:absolute;left:-4px;top:-7px;background:var(--gold);color:#000;border:2px solid #000;font-weight:normal;font-family:'Galmuri14',sans-serif;font-size:12px;padding:1px 5px}
#row2{display:flex;justify-content:space-between;align-items:flex-start;margin-top:8px}
#build{display:flex;flex-direction:column;gap:3px}
#build .r{display:flex;gap:3px}
.bi{position:relative;background:#0a0f1c;border:2px solid #000}
.bi img{width:22px;height:22px}
.bi.sm img{width:16px;height:16px}
.bi .pips{position:absolute;left:1px;right:1px;bottom:-4px;display:flex;gap:1px}
.bi .pips i{flex:1;height:3px;background:#334}
.bi .pips i.on{background:var(--gold)}
.bi.evo{border-color:var(--gold)}
.bi.ready{outline:2px solid var(--gold)}
#tbox{background:rgba(10,15,28,.8);border:2px solid #000;outline:2px solid var(--ln);padding:3px 10px;text-align:center;min-width:86px}
#tbox small{display:block;font-size:9px;color:var(--dim)}
#tbox span{font-family:'Galmuri14',sans-serif;font-size:18px}
#tbox.boss span{color:var(--red)}
#cnt{text-align:right;font-size:12px;line-height:1.6;text-shadow:1px 1px 0 #000;margin-right:44px}
#cnt .c{color:var(--gold)}
#pauseB{position:fixed;right:8px;top:calc(var(--sat) + 30px);width:36px;height:32px;z-index:3;background:var(--pn);border:2px solid var(--ln);box-shadow:0 0 0 2px #000;font-size:13px;padding:0}
#bossbar{left:50%;transform:translateX(-50%);top:calc(var(--sat) + 86px);width:64%;max-width:420px;display:none;text-align:center;text-shadow:1px 1px 0 #000;font-size:12px}
#bossbar div{height:12px;background:#300;border:2px solid #000;outline:2px solid var(--ln);margin-top:3px}
#bossbar i{display:block;height:100%;background:linear-gradient(#ff7a5a 0 35%,#d02a1a 35%);width:100%}
#dashB{position:fixed;right:calc(env(safe-area-inset-right) + 106px);bottom:calc(var(--sab) + 22px);width:62px;height:62px;z-index:3;background:#111a2c;border:3px solid var(--ln);box-shadow:0 0 0 3px #000;padding:0;overflow:hidden;font-size:11px}
#dashB i{position:absolute;left:0;right:0;bottom:0;height:0;background:rgba(0,0,0,.65)}
#dashB span{position:relative;text-shadow:1px 1px 0 #000}
#mini{position:fixed;right:8px;top:calc(var(--sat) + 70px);z-index:2;width:60px;height:144px;border:2px solid #000;outline:2px solid #5a6a8a;image-rendering:pixelated;pointer-events:none}
#ov.scene{background:linear-gradient(rgba(13,20,36,0) 0%,rgba(13,20,36,.15) 55%,rgba(13,20,36,.85) 100%);justify-content:flex-start}
.sbar{display:flex;align-items:center;gap:6px;font-size:11px;margin-top:3px}.sbar span{width:42px;color:var(--dim)}.sbar i{width:14px;height:7px;background:#2a3450;border:1px solid #000;display:inline-block}.sbar i.on{background:var(--gold)}
.ach{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:2px dashed #2a3450;font-size:12px}.ach .ck{width:18px;height:18px;border:2px solid #000;background:#2a3450;flex:none;text-align:center;line-height:14px;font-size:11px}.ach.on .ck{background:var(--grn);color:#000}.ach .t{flex:1}.ach .t small{display:block;color:var(--dim);font-size:10px;margin-top:2px}.ach .rw{color:var(--gold);font-size:11px}
#ultB{position:fixed;right:calc(env(safe-area-inset-right) + 14px);bottom:calc(var(--sab) + 18px);width:80px;height:80px;z-index:3;background:#111a2c;border:3px solid var(--ln);box-shadow:0 0 0 3px #000;padding:0;overflow:hidden}
#ultB i{position:absolute;left:0;right:0;bottom:0;height:0;background:var(--gold);opacity:.55}
#ultB span{position:relative;font-size:11px;line-height:1.3;text-shadow:1px 1px 0 #000}
#ultB.ready{background:#3a2a08;border-color:var(--gold)}
#ultB.ready i{opacity:.9}
#ultB.ready span{font-family:'Galmuri14',sans-serif;font-size:12px;color:#000;text-shadow:none}
#toast{bottom:calc(var(--sab) + 112px);left:0;right:100px;text-align:center;display:flex;flex-direction:column-reverse;align-items:center}
#toast>div>div{display:inline-block;margin:3px auto;background:rgba(10,15,28,.85);border:2px solid #000;outline:2px solid #5a6a8a;padding:4px 10px;font-size:12px}
#banner{top:22%;left:0;right:0;text-align:center;display:none}
#banner div{display:inline-block;background:var(--pn);border:3px solid var(--ln);box-shadow:0 0 0 3px #000;padding:8px 18px;font-family:'Galmuri14',sans-serif;font-size:20px}
#banner.warn div{background:repeating-linear-gradient(45deg,#7a1a10 0 10px,#a02818 10px 20px);border-color:#ffd0c0}
#banner small{display:block;font-family:'Galmuri11',sans-serif;font-size:11px;color:var(--gold);margin-bottom:2px}
/* 부팅·타이틀 */
.boot{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;text-align:center}
.lbar{width:220px;height:16px;background:#0a0f1c;border:2px solid #000;outline:2px solid var(--ln);margin:22px auto 8px}
.lbar i{display:block;height:100%;width:0;background:linear-gradient(#ffe07a 0 35%,#e8a020 35%)}
.ltxt{font-size:11px;color:var(--dim)}
.tip{margin-top:28px;max-width:320px;font-size:12px;color:#c8d4e8;line-height:1.6;background:rgba(10,15,28,.75);border:2px solid #000;outline:2px solid #3a4a6a;padding:8px 12px}
.tip b{font-weight:normal;color:var(--gold)}
.press{margin-top:40px;font-family:'Galmuri14',sans-serif;font-size:16px;color:#fff;text-shadow:2px 2px 0 #000;animation:blink 1.4s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}
.ver{position:fixed;left:0;right:0;bottom:calc(var(--sab) + 10px);text-align:center;font-size:10px;color:rgba(255,255,255,.55);text-shadow:1px 1px 0 #000}
.tut{text-align:center}.tut .pic{height:150px;display:flex;align-items:center;justify-content:center;gap:12px;margin:10px 0 14px}
.tut .pic img{image-rendering:pixelated}.tut h3{font-family:'Galmuri14',sans-serif;font-weight:normal;font-size:18px;margin-bottom:8px;color:var(--gold)}
.tut p{font-size:12px;line-height:1.8;color:#c8d4e8;text-align:left}
.dots{display:flex;justify-content:center;gap:6px;margin:14px 0}.dots i{width:10px;height:10px;background:#2a3450;border:2px solid #000}.dots i.on{background:var(--gold)}
.joy{width:84px;height:84px;border:4px solid #fff;border-radius:50%;position:relative;opacity:.85}.joy:after{content:'';position:absolute;left:38px;top:10px;width:24px;height:24px;background:#fff}
.goal{background:rgba(10,15,28,.82);border:2px solid #000;outline:2px solid var(--gold);padding:7px 10px;font-size:12px;text-align:center;margin:0 0 14px}
.goal b{font-weight:normal;color:var(--gold)}
.newrec{display:inline-block;background:var(--gold);color:#000;font-size:9px;padding:0 4px;margin-left:4px;border:1px solid #000;vertical-align:2px}
.ibox{display:flex;gap:12px;align-items:center;padding:12px;margin-bottom:12px}
.ibox canvas{image-rendering:pixelated;background:#0a0f1c;border:2px solid #000}
/* 오버레이 */
#ov{position:fixed;inset:0;z-index:10;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(5,8,16,.78);padding:calc(var(--sat) + 12px) 14px calc(var(--sab) + 12px);overflow:auto}
#ov.solid{background:var(--bg) repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 2px,transparent 2px 6px);justify-content:flex-start}
.wrap{width:100%;max-width:440px}
.hdr{display:flex;align-items:center;justify-content:space-between;margin:4px 0 14px}
.hdr h2{font-family:'Galmuri14',sans-serif;font-weight:normal;font-size:22px}
.coin{display:flex;align-items:center;gap:5px;font-family:'Galmuri14',sans-serif;color:var(--gold);font-size:15px}
.coin i{width:12px;height:12px;background:var(--gold);border:2px solid #7a5a08;display:inline-block}
.back{background:var(--pn);border:2px solid var(--ln);box-shadow:0 0 0 2px #000;padding:5px 10px;font-size:13px}
.sec{font-size:12px;color:var(--gold);margin:4px 0 8px;letter-spacing:1px}
.logo{text-align:center;margin:18px 0 6px}
.logo h1{font-family:'Galmuri14',sans-serif;font-weight:normal;font-size:40px;color:var(--gold);text-shadow:3px 0 0 #a03010,-3px 0 0 #a03010,0 3px 0 #a03010,0 -3px 0 #a03010,4px 6px 0 #000;letter-spacing:2px}
.logo p{color:var(--dim);font-size:12px;margin-top:10px}
.stage{display:flex;justify-content:center;align-items:flex-end;height:150px;margin:8px 0 6px;position:relative}
.stage canvas{image-rendering:pixelated}
.stage .ped{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:150px;height:22px;background:#1b2740;border:3px solid #000;border-radius:50%}
.pname{text-shadow:2px 2px 0 #000;text-align:center;font-family:'Galmuri14',sans-serif;font-size:16px;margin-bottom:14px}
.pname small{display:block;font-family:'Galmuri11',sans-serif;font-size:11px;color:var(--dim);margin-top:4px}
.grid4{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.pc{background:#111a2c;border:3px solid #3a4a6a;padding:4px 2px 6px;text-align:center;font-size:11px;position:relative}
.pc.sel{border-color:var(--gold);background:#2a2410}
.pc.lock canvas{filter:brightness(0) opacity(.5)}
.pc canvas{display:block;margin:0 auto;image-rendering:pixelated}
.info{padding:10px;margin-bottom:14px;font-size:12px;line-height:1.6}
.info .row{display:flex;align-items:center;gap:6px}
.area{display:flex;align-items:center;gap:10px;width:100%;background:#111a2c;border:3px solid #3a4a6a;padding:8px 10px;margin-bottom:6px;text-align:left}
.area.sel{border-color:var(--gold);background:#2a2410}
.area.lock{opacity:.4}
.area .sw{width:34px;height:34px;flex:none;border:2px solid #000}
.area .t{flex:1}
.area .t b{font-weight:normal;font-size:14px}
.area .t small{display:block;color:var(--dim);font-size:10px;margin-top:2px}
.area .st{color:var(--gold);font-size:11px}
.bot{position:sticky;bottom:0;padding-top:16px;margin-top:6px;background:linear-gradient(transparent,var(--bg) 30%)}
.menu .pb{margin-bottom:12px}
.up{display:flex;align-items:center;gap:10px;padding:10px;margin-bottom:10px}
.up .t{flex:1;font-size:13px}
.up .t small{display:block;color:var(--dim);font-size:10px;margin-top:3px}
.lvp{display:flex;gap:2px;margin-top:5px}
.lvp i{width:10px;height:6px;background:#2a3450;border:1px solid #000}
.lvp i.on{background:var(--gold)}
.buy{background:#2a6ab0;border:2px solid var(--ln);box-shadow:0 0 0 2px #000;padding:6px 8px;font-size:12px;min-width:72px}
.buy:disabled{filter:grayscale(1) brightness(.6)}
.tg{display:flex;justify-content:space-between;align-items:center;padding:12px 10px;margin-bottom:10px;font-size:14px}
.sw2{width:56px;height:26px;background:#2a3450;border:2px solid #000;position:relative}
.sw2 i{position:absolute;top:2px;left:2px;width:20px;height:18px;background:#8a9ab8}
.sw2.on{background:var(--grn)}
.sw2.on i{left:30px;background:#fff}
/* 카드 */
.lvhdr{text-align:center;margin-bottom:12px}
.lvhdr h2{font-family:'Galmuri14',sans-serif;font-weight:normal;font-size:26px;color:var(--gold);text-shadow:3px 3px 0 #000}
.lvhdr p{color:var(--dim);font-size:11px;margin-top:6px}
.card{display:flex;gap:10px;align-items:center;width:100%;padding:10px;margin-bottom:12px;text-align:left;position:relative}
.card img.ico{width:48px;height:48px;flex:none;border:2px solid #000}
.card .nm{font-family:'Galmuri14',sans-serif;font-size:15px}
.card .tag{display:inline-block;font-family:'Galmuri11',sans-serif;font-size:10px;padding:1px 5px;margin-left:5px;vertical-align:2px;border:1px solid #000}
.card .tag.new{background:var(--gold);color:#000}
.card .tag.lv{background:#2a6ab0;color:#fff}
.card .ds{font-size:11px;color:#c8d4e8;margin-top:5px;line-height:1.5}
.card .ev{font-size:10px;color:var(--dim);margin-top:5px;display:flex;align-items:center;gap:4px}
.card .ev img{width:14px;height:14px}
.card .ev .ok{color:var(--grn)}
.card.banish{border-color:var(--red);background:#3a1414}
.tools{display:flex;gap:8px}
.tools button{flex:1;background:var(--pn);border:2px solid var(--ln);box-shadow:0 0 0 2px #000;padding:8px 2px;font-size:12px}
.tools button:disabled{opacity:.35}
.tools button.on{background:var(--red)}
.gain{display:flex;align-items:center;gap:10px;padding:8px;margin-bottom:8px}
.gain img{width:36px;height:36px;border:2px solid #000}
.gain b{font-weight:normal;font-family:'Galmuri14',sans-serif;font-size:14px}
.gain small{display:block;font-size:11px;color:var(--dim);margin-top:2px}
.gain.evo{background:#3a2a08;border-color:var(--gold)}
.chest{width:96px;height:72px;margin:6px auto 14px;position:relative;image-rendering:pixelated}
.statg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.statg div{padding:8px;text-align:center}
.statg small{display:block;color:var(--dim);font-size:10px}
.statg b{font-weight:normal;font-family:'Galmuri14',sans-serif;font-size:18px}
.dmg{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:11px}
.dmg img{width:22px;height:22px;border:2px solid #000}
.dmg .bar{flex:1}
.dmg .bar div{height:8px;background:#2a3450;border:1px solid #000;margin-top:3px}
.dmg .bar i{display:block;height:100%}
.rec{display:flex;justify-content:space-between;padding:6px 0;border-bottom:2px dashed #2a3450;font-size:12px}
.mvrow{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:12px}
.mvrow img{width:26px;height:26px;border:2px solid #000}
.mvrow .ar{color:var(--dim)}
.mvrow .chk{color:var(--grn)}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="hud" id="top">
  <div id="xpw"><i></i><b>Lv.1</b></div>
  <div id="row2"><div id="build"><div class="r" id="bm"></div><div class="r" id="bp"></div></div><div id="tbox"><small>보스까지</small><span>7:00</span></div><div id="cnt"></div></div>
</div>
<div class="hud" id="bossbar"><span></span><div><i></i></div></div>
<div class="hud" id="banner"><div></div></div>
<div class="hud" id="toast"></div>
<button id="pauseB">II</button>
<button id="dashB"><i></i><span>회피</span></button>
<canvas id="mini" width="60" height="144"></canvas>
<button id="ultB"><i></i><span>궁극기</span></button>
<div id="ov"><div class="wrap" id="ovb"></div></div>

function runMoves(dt){

      for(let i=0;i<L.n;i++){const t=ts[i%ts.length];const a=Math.atan2(t.y-t.r-(P.y-16),t.x-P.x)+(i>=ts.length?rand(-0.2,0.2):0);

      for(let i=0;i<=L.j&&cur;i++){hit.add(cur);R.fx.push({k:'bolt',x0:px,y0:py,x1:cur.x,y1:cur.y-cur.r,c,life:0.18,ml:0.18,thick:evo});hitE(cur,dm,M.ty,{src});px=cur.x;py=cur.y-cur.r;
        let nb=null,bd=180*A;for(const e of query(cur.x,cur.y,180*A,QB)){if(hit.has(e)||e.dead)continue;const d=dist(e,cur);if(d<bd){bd=d;nb=e;}}cur=nb;}break;}
    case 'cone':{const tg=nearestN(1,300)[0];R.cds[id]=L.cd*C;const base=tg?Math.atan2(tg.y-P.y,tg.x-P.x):Math.atan2(P.face.y,P.face.x);
      for(let i=0;i<L.n;i++){const a=base+(i-(L.n-1)/2)*(evo?0.2:0.16);R.proj.push({x:P.x,y:P.y-14,vx:Math.cos(a)*M.spd*rand(0.85,1.1),vy:Math.sin(a)*M.spd*rand(0.85,1.1),life:0.75,d:dm,ty:M.ty,p:1,hit:new Set(),sz:7*A,slow:M.slow,src});}break;}
    case 'puddle':{const ts=nearestN(12,380);if(!ts.length){R.cds[id]=0.3;break;}R.cds[id]=L.cd*C;

function collideObst(o2,r){if(R.ponds)for(const o of R.ponds){const dx=o2.x-o.x,ey=(o2.y-o.y)/0.6,rr=o.r+r*1.2,dd=Math.hypot(dx,ey);if(dd<rr&&dd>0.01){o2.x=o.x+dx/dd*rr;o2.y=o.y+ey/dd*rr*0.6;}}for(const o of R.obst){const dx=o2.x-o.x,dy=o2.y-o.y,rr=o.r*0.55+r;if(dx>rr||dx<-rr||dy>rr||dy<-rr)continue;const d=Math.hypot(dx,dy)||0.1;if(d<rr){o2.x+=dx/d*(rr-d);o2.y+=dy/d*(rr-d);}}o2.x=clamp(o2.x,16,MW-16);o2.y=clamp(o2.y,16,MH-16);}
function update(dt){
  R.t+=dt;P.t+=dt;P.flash=Math.max(0,P.flash-dt);P.inv=Math.max(0,P.inv-dt);R.shake*=0.86;R.gemT-=dt;if(R.gemT<=0)R.gemC=0;
  let mx=0,my=0;
  if(joy.on){const dx=joy.x-joy.ox,dy=joy.y-joy.oy,d=Math.hypot(dx,dy);if(d>6){const k=Math.min(1,d/50);mx=dx/d*k;my=dy/d*k;}}
  if(keys['w']||keys['arrowup'])my-=1;if(keys['s']||keys['arrowdown'])my+=1;if(keys['a']||keys['arrowleft'])mx-=1;if(keys['d']||keys['arrowright'])mx+=1;
  const ml=Math.hypot(mx,my);if(ml>1){mx/=ml;my/=ml;}
  P.moving=ml>0.05;R.dashCd=Math.max(0,R.dashCd-dt);P.slowT=Math.max(0,P.slowT-dt);
  if(P.dash){const D=P.dash;D.t+=dt;P.x+=D.vx*760*dt;P.y+=D.vy*760*dt;P.moving=true;if(R.pid!=92)collideObst(P,12);P.x=clamp(P.x,16,MW-16);P.y=clamp(P.y,16,MH-16);R.fx.push({k:'ghost',sp:curSp(),x:P.x,y:P.y,row:P.row,life:0.25,ml:0.25});if(D.t>=D.dur)P.dash=null;}
  else if(P.moving){const spd=pSpeed()*(P.slowT>0?0.6:1);P.x+=mx*spd*dt;P.y+=my*spd*dt;P.row=dirRow(mx,my);const l=Math.hypot(mx,my);P.face={x:mx/l,y:my/l};if(R.pid==92){P.x=clamp(P.x,16,MW-16);P.y=clamp(P.y,16,MH-16);}else collideObst(P,12);}
  const mh=maxHp();P.hp=Math.min(mh,P.hp+(iv('leftovers')*0.6+(R.pid==1?1:0))*dt);
  if(!R.boss){
    if(!R.rage&&!R.endless&&R.t>=420){R.rage=true;banner('야생 포켓몬이 폭주한다!','7분 경과',2.6,true);sfx('boss');shake(6);}
    R.spawnT-=dt;const rate=(0.8+R.t/45+Math.max(0,Math.min(R.t,420)-150)/30)*(R.rage?1.6:1);if(R.spawnT<=0&&R.en.length-R.propN<230){R.spawnT=1;spawnRing(Math.round(rate));}
    R.eliteT-=dt;if(R.eliteT<=0){R.eliteT=45;spawnRing(1,'elite');toast('강한 기운이 다가온다');}
    R.swarmT-=dt;if(R.swarmT<=0){R.swarmT=90;const n=26+Math.floor(R.t/20);const sp=pick(R.a.late);for(let i=0;i<n;i++){const a=i/n*6.283;spawnEnemy(sp,'n',clamp(P.x+Math.cos(a)*420,30,MW-30),clamp(P.y+Math.sin(a)*420,30,MH-30));}toast('무리에 둘러싸였다!');}
    if(R.midT.length&&R.t>=R.midT[0]&&!R.endless){R.midT.shift();spawnMid();}
    const inGate=!R.endless&&!R.bossOn&&Math.hypot(P.x-R.gate.x,P.y-R.gate.y)<R.gate.r;if(inGate&&!R.gateAsk&&!R.gateGo){R.gateAsk=true;askGate();}if(!inGate)R.gateAsk=false;const atGate=inGate&&R.gateGo;if(atGate||(R.endless&&R.t>=R.nextBossT)){if(atGate){R.bossOn=true;for(const e of R.en)if(e.tier==='n'&&dist(e,R.gate)<400)e.dead=true;}R.nextBossT=R.t+180;const a=R.a;R.boss=spawnEnemy(a.boss,'boss',atGate?R.gate.x:clamp(P.x,100,MW-100),atGate?R.gate.y-60:clamp(P.y-330,100,MH-100));R.boss.atkT=3;R.boss.mode='walk';banner(`${nm(a.boss)}`,a.bt,2.8,true);sfx('boss');if(S.set.bgm)bgmStart(R.ai,true);shake(8);}
  }else if(R.en.length-R.propN<80){R.spawnT-=dt;if(R.spawnT<=0){R.spawnT=1.5;spawnRing(3);}}
  buildGrid();
  for(const e of R.en){
    if(e.dead)continue;e.flash=Math.max(0,e.flash-dt);if(e.tier==='prop')continue;e.t+=dt;e.slow=Math.max(0,e.slow-dt);e.hcd-=dt;
    if(e.afx==='leader'){e.sumT-=dt;if(e.sumT<=0){e.sumT=5;for(let i=0;i<3;i++){const a=Math.random()*6.283;spawnEnemy(pick(R.a.pool),'n',clamp(e.x+Math.cos(a)*50,30,MW-30),clamp(e.y+Math.sin(a)*50,30,MH-30));}puff(e.x,e.y);}}
    if(e.afx==='rage'&&!e.raged&&e.hp<e.mhp*0.5){e.raged=true;e.spd*=1.8;e.dmg*=1.3;for(let i=0;i<12;i++)R.fx.push({k:'p',x:e.x,y:e.y-20,vx:rand(-120,120),vy:rand(-120,40),life:0.4,ml:0.4,c:'#ff4a2a',s:4});}
    let dx=P.x-e.x,dy=P.y-e.y,d=Math.hypot(dx,dy)||1;
    if(e.tier==='boss'||e.tier==='mid')bossAI(e,dt,dx,dy,d);
    else{roleMove(e,dt,dx,dy,d);if(e.dead)continue;}
    for(const o of query(e.x,e.y,e.r,QB)){if(o===e)continue;const ox=e.x-o.x,oy=e.y-o.y,rr=(e.r+o.r)*0.8;if(Math.abs(ox)>rr||Math.abs(oy)>rr)continue;const od=Math.hypot(ox,oy)||0.1;if(od<rr){const p=(rr-od)*0.25;const w=(e.tier==='boss'||e.tier==='mid')?0:1;e.x+=ox/od*p*w;e.y+=oy/od*p*w;}}
    if(e.tier!=='boss'&&e.role!=='ghost'&&e.role!=='fly')collideObst(e,e.r*0.6);
    if(e.role!=='bomb'&&d<e.r+12&&e.hcd<=0){e.hcd=0.7;hurtP(e.dmg);}
  }
  R.en=R.en.filter(e=>!e.dead);
  runMoves(dt);
  for(let i=R.proj.length-1;i>=0;i--){const p=R.proj[i];p.life-=dt;
    if(p.home){if(p.home.dead){const n=nearestN(1,400);p.home=n[0]||null;}if(p.home){const a=Math.atan2(p.home.y-p.home.r-p.y,p.home.x-p.x);const sp=MOVES[p.src].spd;p.vx+=(Math.cos(a)*sp-p.vx)*dt*6;p.vy+=(Math.sin(a)*sp-p.vy)*dt*6;}}
    p.x+=p.vx*dt;p.y+=p.vy*dt;let gone=p.life<=0;
    if(!gone)for(const e of query(p.x,p.y+10,p.sz+4,QB)){if(p.hit.has(e))continue;if(Math.hypot(e.x-p.x,e.y-e.r-p.y)<e.r+p.sz){p.hit.add(e);hitE(e,p.d,p.ty,{slow:p.slow,kb:{x:p.vx*0.05,y:p.vy*0.05},src:p.src});if(p.ex){boom(p.x,p.y+10,55*areaMul(),p.d*0.6,p.ty,null,p.src);}if(p.hit.size>p.p){gone=true;break;}}}
    if(Math.random()<0.5)R.fx.push({k:'p',x:p.x,y:p.y,vx:0,vy:0,life:0.2,ml:0.2,c:TC[p.ty],s:p.sz*0.5});
    if(gone)R.proj.splice(i,1);}
  for(let i=R.ep.length-1;i>=0;i--){const p=R.ep[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(Math.hypot(p.x-P.x,p.y-(P.y-14))<14){hurtP(p.d);R.ep.splice(i,1);continue;}if(p.life<=0)R.ep.splice(i,1);}
  for(let i=R.warn.length-1;i>=0;i--){const w=R.warn[i];w.t-=dt;if(w.t>0)continue;R.warn.splice(i,1);if(Math.hypot(P.x-w.x,(P.y-w.y)/0.5)<w.r+8){hurtP(w.d);if(w.slow)P.slowT=w.slow;}R.fx.push({k:w.ty==='electric'?'bolt':'pillar',x:w.x,y:w.y,x0:w.x,y0:w.y-380,x1:w.x,y1:w.y,r:w.r,c:TC[w.ty],life:0.3,ml:0.3,thick:1});R.fx.push({k:'ring',x:w.x,y:w.y,r:w.r,c:TC[w.ty],life:0.3,ml:0.3});sfx('boom');}
  for(let i=R.zones.length-1;i>=0;i--){const z=R.zones[i];z.t-=dt;
    z.tick-=dt;if(z.tick<=0){z.tick=0.5;for(const e of query(z.x,z.y,z.r,QB))if(Math.hypot(e.x-z.x,e.y-z.y)<z.r+e.r){const d=hitE(e,z.d,z.ty,{src:z.src});P.hp=Math.min(mh,P.hp+d*z.heal);}}
    if(z.t<=0)R.zones.splice(i,1);}
  const prr=pickR();
  for(let i=R.gems.length-1;i>=0;i--){const g=R.gems[i];const d=Math.hypot(g.x-P.x,g.y-P.y);
    if(d<prr||g.mag){g.mag=true;const s=Math.max(280,d*4)*dt;g.x+=(P.x-g.x)/d*Math.min(d,s);g.y+=(P.y-10-g.y)/d*Math.min(d,s);}
    if(d<16){gainXp(g.v);R.gems.splice(i,1);R.gemC=Math.min(R.gemC+1,24);R.gemT=0.35;sfx('gem',R.gemC);}}
  if(R.gems.length>500){const merged=R.gems.splice(0,250).reduce((s,g)=>s+g.v,0);R.gems.push({x:P.x+rand(-200,200),y:P.y+rand(-200,200),v:merged,mag:false});}
  for(let i=R.drops.length-1;i>=0;i--){const it=R.drops[i];if(Math.hypot(it.x-P.x,it.y-P.y)>Math.max(28,prr*0.5))continue;R.drops.splice(i,1);
    if(it.k==='coin'){R.gold+=Math.round(it.v*(1+bl('luck')*0.5+R.tier*0.6));sfx('coin');}else if(it.k==='berry'){P.hp=Math.min(mh,P.hp+mh*0.3);toast('오랭열매로 체력을 회복했다');}
    else if(it.k==='magnet'){for(const g of R.gems)g.mag=true;toast('자석! 경험치를 모두 끌어당긴다');}
    else if(it.k==='chest'){R.chests.push(it.n||1);}}
  for(const sh of R.shrines){if(sh.done)continue;const inn=dist(sh,P)<70;const was=sh.ch;sh.ch=inn?Math.min(1,sh.ch+dt/4*(hb(4)?1.4:1)):Math.max(0,sh.ch-dt/10);if(inn&&was===0)toast('사당에 머무르면 축복을 받는다');if(sh.ch>=1){sh.done=true;R.blessQ++;sfx('chest');for(let i=0;i<20;i++)R.fx.push({k:'p',x:sh.x,y:sh.y-40,vx:rand(-150,150),vy:rand(-200,50),life:0.6,ml:0.6,c:'#e0c0ff',s:4});}}
  for(let i=R.fx.length-1;i>=0;i--){const f=R.fx[i];f.life-=dt;if(f.k==='p'){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vx*=0.9;f.vy*=0.9;}if(f.life<=0)R.fx.splice(i,1);}
  for(let i=R.tx.length-1;i>=0;i--){const t=R.tx[i];t.life-=dt;t.y-=30*dt;if(t.life<=0)R.tx.splice(i,1);}
  if(P.hp<=0){if(R.rev>0){R.rev--;P.hp=maxHp()*0.5;P.inv=2;for(const e of R.en)if(e.tier!=='boss'&&dist(e,P)<300)hitE(e,9e9,'normal');banner('기력의조각','부활',1.5);sfx('evo');}else{loseRun();return;}}
  nextModal();
}
function askGate(){paused=true;joy.on=false;const low=R.lv<R.rec;const em=eff(PARTNERS[R.pid].ty,SP[R.a.boss][1]);const mu=em>1?'<span style="color:var(--grn)">유리</span>':em<1?'<span style="color:var(--red)">불리</span>':'보통';
  openOv(`<div class="lvhdr"><h2>${R.a.n} 체육관</h2><p>${R.a.bt} ${nm(R.a.boss)}</p></div><div class="px info" style="text-align:center;font-size:13px">${SP[R.a.boss][1].map(t=>TN[t]).join('·')} 타입 · 상성 ${mu}<br>권장 Lv.${R.rec} · 지금 Lv.<span style="color:${low?'var(--red)':'var(--grn)'}">${R.lv}</span><br>${low?'아직 약할 수 있습니다. 주변에서 더 성장하고 와도 됩니다.':'준비가 된 것 같습니다.'}<br><span style="color:var(--dim);font-size:11px">7분이 지나면 야생 포켓몬이 폭주합니다</span></div>
  <button class="pb" onclick="gateGo()">도전한다</button><button class="pb gray" onclick="gateNo()">아직이다</button>`,false,'gate');}
function gateGo(){sfx('click');R.gateGo=true;closeOv();paused=false;}
function gateNo(){sfx('click');closeOv();paused=false;const dx=P.x-R.gate.x,dy=P.y-R.gate.y,d=Math.hypot(dx,dy)||1;P.x=R.gate.x+dx/d*(R.gate.r+30);P.y=R.gate.y+dy/d*(R.gate.r+30);R.gateAsk=false;}
function nextModal(){if(R.queue>0)showCards();else if(R.blessQ>0)showBless();else if(R.chests.length)openChest();}
function bossAI(e,dt,dx,dy,d){
  e.atkT-=dt;const big=e.tier==='boss',ty=SP[e.sp][1][0],sp2=e.enr?0.65:1;
  if(big&&!e.enr&&e.hp<e.mhp*0.5){e.enr=true;e.spd*=1.3;banner(`${josa(nm(e.sp),'이','가')} 분노했다!`,'페이즈 2',2,true);sfx('boss');shake(8);}
  if(e.mode==='spiral'){e.spT-=dt;e.shT-=dt;e.row=dirRow(dx,dy);if(e.shT<=0){e.shT=0.11;const arms=e.enr?3:2;for(let k=0;k<arms;k++){const a=e.spA+k*6.283/arms;R.ep.push({x:e.x,y:e.y-30,vx:Math.cos(a)*150,vy:Math.sin(a)*150,life:4,d:e.dmg*0.45,c:TC[ty],sm:1});}e.spA+=0.33;}if(e.spT<=0){e.mode='walk';e.atkT=2.6*sp2;}return;}
  if(e.mode==='walk'){e.x+=dx/d*e.spd*dt;e.y+=dy/d*e.spd*dt;e.row=dirRow(dx,dy);
    if(e.atkT<=0){const r=Math.random();
      if(big&&r<0.25){e.atkT=3*sp2;const n=e.enr?7:5;for(let i=0;i<n;i++){const a=Math.random()*6.283,rr=i?rand(60,170):0;R.warn.push({x:P.x+Math.cos(a)*rr,y:P.y+Math.sin(a)*rr*0.6,r:58,t:1.1,mt:1.1,d:e.dmg*1.0,ty,slow:ty==='ice'?2.5:0});}}
      else if(big&&r<0.45){e.mode='spiral';e.spT=2.4;e.shT=0;e.spA=Math.random()*6.283;}
      else if(r<0.72){e.mode='aim';e.aimT=e.enr?0.6:0.9;e.ax=dx/d;e.ay=dy/d;}else{e.mode='walk';e.atkT=3*sp2;const n=(e.tier==='boss'?14:10)+(e.enr?6:0);for(let i=0;i<n;i++){const a=i/n*6.283+rand(0,0.3);R.ep.push({x:e.x,y:e.y-30,vx:Math.cos(a)*170,vy:Math.sin(a)*170,life:4,d:e.dmg*0.8,c:TC[SP[e.sp][1][0]]});}}}}
  else if(e.mode==='aim'){e.aimT-=dt;if(e.aimT<=0){e.mode='dash';e.dashT=0.55;shake(5);}}
  else if(e.mode==='dash'){const ds=e.tier==='boss'?620:520;e.x+=e.ax*ds*dt;e.y+=e.ay*ds*dt;e.dashT-=dt;e.x=clamp(e.x,40,MW-40);e.y=clamp(e.y,40,MH-40);if(e.dashT<=0){e.mode='walk';e.atkT=3.2*sp2;}}
}
function hurtP(d){if(P.inv>0)return;P.inv=0.25;d*=(1-Math.min(0.6,iv('saponin')*0.07+bl('def')*0.1));P.hp-=d;P.flash=0.12;sfx('hurt');shake(3);}
function gainXp(v){R.xp+=v*(1+iv('expshare')*0.12+S.up.xp*0.05+bl('xp')*0.2+(hb(3)?0.1:0));while(R.xp>=need(R.lv)){R.xp-=need(R.lv);R.lv++;R.queue++;
  const ev=PARTNERS[R.pid].evo;if(R.stage<ev.length&&R.lv>=ev[R.stage]){const old=nm(curSp());R.stage++;P.hp=maxHp();banner(`${ro(nm(curSp()))} 진화!`,`${old}의 모습이`,2.2);sfx('evo');buildHud();for(let i=0;i<30;i++)R.fx.push({k:'p',x:P.x,y:P.y-20,vx:rand(-200,200),vy:rand(-200,200),life:0.6,ml:0.6,c:'#fff',s:4});}}}
function afterPick(){P.inv=Math.max(P.inv,1);for(const e of R.en){if(e.tier!=='n')continue;const d=dist(e,P);if(d<180&&d>0){e.kb.x+=(e.x-P.x)/d*90;e.kb.y+=(e.y-P.y)/d*90;}}R.fx.push({k:'ring',x:P.x,y:P.y,r:180,c:'#fff',life:0.4,ml:0.4});}

// ═══════════ 카드·상자 ═══════════
function evoReady(id){const M=MOVES[id];return R.moves[id]===5&&M.evo&&iv(M.evo[0])>0;}
function cardPool(){const P2=PARTNERS[R.pid],pool=[];const nMv=Object.keys(R.moves).length,nIt=Object.keys(R.items).length;
  for(const id of P2.pool){if(R.ban.has(id))continue;const l=R.moves[id]||0;if(l>0&&l<5)pool.push({k:'mv',id,w:3});else if(!l&&nMv<5)pool.push({k:'mv',id,w:1.5});}
  for(const id of P2.items){if(R.ban.has(id))continue;const l=R.items[id]||0;if(l>0&&l<5)pool.push({k:'it',id,w:2});else if(!l&&nIt<5){const pair=Object.keys(R.moves).some(m=>MOVES[m].evo&&MOVES[m].evo[0]===id&&R.moves[m]<6);pool.push({k:'it',id,w:pair?2.2:1});}}
  return pool;}
function makeCards(){const pool=cardPool();const out=[];while(out.length<3&&pool.length){let tw=pool.reduce((s,c)=>s+c.w,0),r=Math.random()*tw,i=0;for(;i<pool.length;i++){r-=pool[i].w;if(r<=0)break;}out.push(pool.splice(Math.min(i,pool.length-1),1)[0]);}
  if(!out.length)out.push({k:'heal'},{k:'gold'});return out;}
let cards=[],banMode=false;
function cardHTML(c,i){
  if(c.k==='mv'){const M=MOVES[c.id],l=R.moves[c.id]||0;const ev=M.evo,has=iv(ev[0])>0;
    return `<button class="card px ${banMode?'banish':''}" onclick="pickCard(${i})"><img class="ico" src="${iconMove(c.id)}"><div style="flex:1"><div class="nm">${M.n}${l?`<span class="tag lv">Lv.${l} → ${l+1}</span>`:'<span class="tag new">NEW</span>'}</div>
    <div class="ds">${l?'':KDESC[M.t]+'<br>'}${statLine(M.L[l])} · ${TN[M.ty]}</div><div class="ev"><span>진화</span><img class="ico" src="${iconItem(ev[0])}"><span class="${has?'ok':''}">${ITEMS[ev[0]].n}${has?' 보유':''}</span><span>→ ${ev[1]}</span></div></div></button>`;}
  if(c.k==='it'){const I=ITEMS[c.id],l=R.items[c.id]||0;const pairs=PARTNERS[R.pid].pool.filter(m=>MOVES[m].evo[0]===c.id).map(m=>MOVES[m].n);
    return `<button class="card px ${banMode?'banish':''}" onclick="pickCard(${i})"><img class="ico" src="${iconItem(c.id)}"><div style="flex:1"><div class="nm">${I.n}${l?`<span class="tag lv">Lv.${l} → ${l+1}</span>`:'<span class="tag new">NEW</span>'}</div>
    <div class="ds">${I.d(l+1)}</div>${pairs.length?`<div class="ev"><span>진화 재료:</span><span>${pairs.join(', ')}</span></div>`:''}</div></button>`;}
  if(c.k==='heal')return `<button class="card px" onclick="pickCard(${i})"><img class="ico" src="${iconItem('_h','#e04a5a','bottle')}"><div><div class="nm">좋은상처약</div><div class="ds">체력 50% 회복</div></div></button>`;

  P2(2,10,40,22,'#000');P2(3,11,38,20,'#e8e0d0');P2(3,11,38,3,'#fff');P2(0,6,44,6,'#000');P2(1,7,42,4,'#d8403a');P2(4,3,36,4,'#000');P2(5,4,34,3,'#b83030');
  P2(17,18,10,13,'#000');P2(18,19,8,12,'#4a3a6a');P2(21,19,2,12,'#2a2040');P2(6,16,8,6,'#000');P2(7,17,6,4,'#8ac8ff');P2(30,16,8,6,'#000');P2(31,17,6,4,'#8ac8ff');
  P2(19,12,6,5,'#000');P2(20,13,4,2,'#e33');P2(20,15,4,1,'#fff');P2(21,14,2,1,'#000');P2(2,31,40,2,'#6a6058');});}
function shrineCanvas(done){return pixCanvas(14,24,g=>{const P2=(x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(x,y,w,h);};P2(1,19,12,5,'#000');P2(2,20,10,3,done?'#555':'#8a84a0');P2(3,8,8,12,'#000');P2(4,9,6,11,done?'#5a5a5a':'#b0a8c8');P2(4,9,2,11,done?'#6a6a6a':'#d0c8e8');
  P2(2,6,10,3,'#000');P2(3,7,8,1,done?'#666':'#8a84a0');P2(5,1,4,5,'#000');P2(6,2,2,3,done?'#444':'#e0c0ff');P2(6,12,2,4,done?'#444':'#7a5ab0');});}
let SCN=null;
function menuScene(){const w=180,h=Math.round(180*H/W);const c=pixCanvas(w,h,g=>{const band=['#2a1a4a','#4a2a6a','#7a3a7a','#b0507a','#e07a6a','#f0a868'];const by=h*0.55/band.length;band.forEach((col,i)=>{g.fillStyle=col;g.fillRect(0,Math.round(i*by),w,Math.ceil(by)+1);});
  pcirc(g,Math.round(w*0.72),Math.round(h*0.42),10,'#ffd890');pcirc(g,Math.round(w*0.72),Math.round(h*0.42),8,'#fff0c0');
  g.fillStyle='rgba(255,220,200,.5)';for(const[cx,cy,cw]of[[20,0.12,26],[110,0.2,34],[60,0.3,22]]){g.fillRect(cx,Math.round(h*cy),cw,3);g.fillRect(cx+5,Math.round(h*cy)-2,cw-12,2);}
  let y0=h*0.5;g.fillStyle='#3a2a5a';for(let x=0;x<w;x+=2){const m=Math.round(y0-Math.abs(Math.sin(x*0.035))*28-Math.abs(Math.sin(x*0.11))*8);g.fillRect(x,m,2,h-m);}
  g.fillStyle='#2a3a4a';for(let x=0;x<w;x+=2){const m=Math.round(h*0.58-Math.abs(Math.sin(x*0.05+1))*16);g.fillRect(x,m,2,h-m);}
  g.fillStyle='#1e3a2a';for(let x=0;x<w;x+=2){const m=Math.round(h*0.64-Math.abs(Math.sin(x*0.08+2))*10);g.fillRect(x,m,2,h-m);}
  for(let x=-4;x<w;x+=11){const ty2=Math.round(h*0.66+((x*7)%9));g.fillStyle='#10261a';g.fillRect(x+4,ty2-4,3,8);pcirc(g,x+5,ty2-9,5,'#163a22');}
  g.fillStyle='#2e6a32';g.fillRect(0,Math.round(h*0.7),w,h);g.fillStyle='#3a7a3a';for(let i=0;i<220;i++)g.fillRect((i*37)%w,Math.round(h*0.7)+((i*53)%Math.round(h*0.3)),2,1);
  g.fillStyle='#a8844e';for(let y=Math.round(h*0.7);y<h;y++){const t=(y-h*0.7)/(h*0.3);const half=6+t*40;g.fillRect(Math.round(w/2-half),y,Math.round(half*2),1);}});
  return {c,w:cv.width,h:cv.height};}
// ═══════════ 루프 ═══════════
let last=0;
function loop(ts){const dt=Math.min(0.05,(ts-last)/1000||0);last=ts;
  if(state==='play'||state==='over'){if(state==='play'&&!paused&&!R.done)update(dt);render();}
  else{ctx.setTransform(1,0,0,1,0,0);ctx.imageSmoothingEnabled=false;if(!SCN||SCN.w!==cv.width||SCN.h!==cv.height)SCN=menuScene();ctx.drawImage(SCN.c,0,0,cv.width,cv.height);}
  hud(dt);requestAnimationFrame(loop);}
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(state==='play'&&!paused)togglePause();if(AU.c)AU.c.suspend();}else if(AU.c)AU.c.resume();});
load();boot();requestAnimationFrame(loop);
</script>
